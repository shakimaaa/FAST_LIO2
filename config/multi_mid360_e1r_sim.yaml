/**:
    ros__parameters:
        feature_extract_enable: false
        # 精细建图：保留更多点、更小体素、更多迭代（仿真可偏激进，实机需权衡算力）
        point_filter_num: 3                     # 1=保留最多点(最精细) 2/3/4 依次更稀疏
        max_iteration: 3                        # 每帧迭代次数，略增有利于收敛与细节
        filter_size_surf: 0.3                  # 匹配用体素(m)：越小匹配越细，当前偏精细
        filter_size_map: 0.3                   # 地图体素(m)：越小地图分辨率越高
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./src/LIO/FAST_LIO2/PCD/test2.pcd"

        common:
            lid_topic:  "/E1R/lidar/points"
            imu_topic:  "/imu"
            time_sync_en: false         # Disabled since IMU and LiDAR now use the same simulation time base
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            debug_info: true
        tf:
            base_to_camera_init:
                parent_frame: "base"
                child_frame: "camera_init"
                tx: 33.4e-3     # 0.482
                ty: -17.2765e-3 # 0.0
                tz: 51.0469e-3  # 0.0453
                qx: 0.0            # 0.0
                qy: 0.0         # 0.70710678
                qz: 0.0         # 0.0
                qw: 1.0         # 0.70710678

        preprocess:
            lidar_type: 5                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            # 顺滑路径：减小 IMU 过程噪声，更信任 IMU 预测，轨迹更平滑（若过于平滑可适当增大）
            acc_cov: 0.1                       # 0.1->0.05 更信 IMU，位姿更顺
            gyr_cov: 0.1                       # 0.1->0.05 同上
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            # Mid360 机身自带 IMU，同体 T=0。仿真中点云与 IMU 已对齐时用单位阵可得到水平点云/path
            extrinsic_T: [ 0.4666, 0.0172765, -0.0510469 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]
            # 若实机雷达 pitch 90° 安装且点云倾斜，可改用: [ 0,0,1 / 0,1,0 / -1,0,0 ]
        multi:
            # 总雷达数 1~3：1=仅主雷达；2=主+第二路；3=主+第二+第三路
            # 省略 lidar_count 时：multi_en false→1；multi_en true→2（兼容旧配置）
            lidar_count: 3
            multi_en: true
            removed_en: false
            # 辅帧 header 与主帧 lidar_end_time 最大允许 |dt|（秒）；<=0 不丢弃，仍取最接近帧
            aux_time_sync_max_diff: -1. #0.8
            # 每路辅雷达队列最大帧数；<=0 不限制长度
            aux_buffer_max_size: 32
            # 融合时打印「辅 header − 主 lidar_end」时间差，节流周期(ms)；0=不打印 默认值1000
            aux_sync_time_log_ms: 0 #1000

            # 辅雷达并入主雷达系后：TF+胶囊剔 RL/RR 自点（需 joint_states + robot_state_publisher）
            leg_filter_capsule_en: true
            leg_filter_crop_fallback: true
            leg_filter_target_frame: "lidar_link"

            # 辅路体素(m)：默认不写则与顶层 filter_size_surf 相同；0=关闭下采样
            filter_size_voxel_lidar_2: 0.1  # 0.1
            filter_size_voxel_lidar_3: 0.1

            # ---------- 第 2 路（相对主雷达坐标系的外参）----------
            lidar_type: 5
            lid_topic_2: "/E1R2/lidar/points"
            Lidar2_to_Lidar_T: [ -0.2, 0.0, -0.1 ]
            Lidar2_to_Lidar_R: [0.000796, 0.0, 0.9999997,
                                0.0,      1.0, 0.0,
                                -0.9999997,0.0, 0.000796]
            # scan_line: 4
            # timestamp_unit: 3
            # scan_rate: 16

            # ---------- 第 3 路（仅当 lidar_count: 3）----------
            lid_topic_3: "/E1R3/lidar/points"
            lidar_type_3: 5                    # -1 表示同主雷达
            # ROS2 要求 double[] 序列类型一致，勿写裸 0（会变成 int）
            Lidar3_to_Lidar_T: [ -0.75, 0.0, -0.1 ]
            Lidar3_to_Lidar_R: [0.000796, 0.0, 0.9999997,
                                0.0,      1.0, 0.0,
                                -0.9999997,0.0, 0.000796]
            # scan_line_3: -1
            # timestamp_unit_3: -1
            # scan_rate_3: -1


        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # true: 保存/发布地图用未降采样点云，精细建图建议 true
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.


