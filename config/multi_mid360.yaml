/**:
    ros__parameters:
        feature_extract_enable: false
        # 精细建图：保留更多点、更小体素、更多迭代（仿真可偏激进，实机需权衡算力）
        point_filter_num: 4                     # 1=保留最多点(最精细) 2/3/4 依次更稀疏
        max_iteration: 3                        # 每帧迭代次数，略增有利于收敛与细节
        filter_size_surf: 0.3                  # 匹配用体素(m)：越小匹配越细，当前偏精细
        filter_size_map: 0.3                   # 地图体素(m)：越小地图分辨率越高
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./src/LIO/FAST_LIO2/PCD/test1.pcd"

        common:
            lid_topic:  "/rslidar_points"    #"/mid360"
            imu_topic:  "/imu_tf/imu"                  #"/mid360/imu"
            time_sync_en: false         # Disabled since IMU and LiDAR now use the same simulation time base
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            debug_info: true
        tf:
            base_to_camera_init:
                parent_frame: "base_link"
                child_frame: "camera_init"
                tx: 33.4e-3     # 0.482
                ty: -17.2765e-3 # 0.0
                tz: 51.0469e-3  # 0.0453
                qx: 0.0            # 0.0
                qy: 0.0         # 0.70710678
                qz: 0.0         # 0.0
                qw: 1.0         # 0.70710678

        preprocess:
            lidar_type: 5                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.1
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            # 顺滑路径：减小 IMU 过程噪声，更信任 IMU 预测，轨迹更平滑（若过于平滑可适当增大）
            acc_cov: 0.1                       # 0.1->0.05 更信 IMU，位姿更顺
            gyr_cov: 0.1                       # 0.1->0.05 同上
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            # Mid360 机身自带 IMU，同体 T=0。仿真中点云与 IMU 已对齐时用单位阵可得到水平点云/path
            extrinsic_T: [ 0.385, 0.017, -0.1 ]
            extrinsic_R: [ -0.966, 0., 0.259,
                            0., 1., 0.,
                            -0.259, 0., -0.966]
            # 若实机雷达 pitch 90° 安装且点云倾斜，可改用: [ 0,0,1 / 0,1,0 / -1,0,0 ]
        multi:
            # 总雷达数 1~3：1=仅主雷达；2=主+第二路；3=主+第二+第三路
            # 省略 lidar_count 时：multi_en false→1；multi_en true→2（兼容旧配置）
            lidar_count: 1
            multi_en: false
            removed_en: false
            # 辅帧 header 与主帧 lidar_end_time 最大允许 |dt|（秒）；<=0 不丢弃，仍取最接近帧
            aux_time_sync_max_diff: -1.
            # 每路辅雷达队列最大帧数；<=0 不限制长度
            aux_buffer_max_size: 32
            # 融合时打印「辅 header − 主 lidar_end」时间差，节流周期(ms)；0=不打印 默认值1000
            aux_sync_time_log_ms: 0 #1000

            filter:
                # 主雷达系下底部离群点裁剪盒；过滤机器人腹部/底盘附近的自点与异常反射
                bottom_crop_en: true
                bottom_crop_min: [ -0.35, -0.25, -0.45 ]
                bottom_crop_max: [  0.35,  0.25, -0.10 ]
                # 辅雷达并入主雷达系后：TF+几何过滤剔四腿自点与遮挡扇区边缘噪声（需 joint_states + robot_state_publisher）
                leg_capsule_en: true
                leg_sector_en: true
                leg_sector_marker_en: true        # 是否发布足端楔形区域的 RViz MarkerArray（话题：/leg_sector_markers）
                leg_crop_fallback: false
                leg_target_frame: "lidar_link"
                leg_sector_marker_frame: "camera_init"  # Marker 显示坐标系，可改为 camera_init / base / lidar_link
                # 方案一：以四个足端(FL/FR/RL/RR_foot)在 lidar_link 下的位置为顶点，起始边始终与 x 轴平行，再朝腿外侧扫出楔形过滤区
                leg_sector_angle_margin_deg: 40.0    # 从“与 x 轴平行的起始边”扫出的角度(度)；左腿朝 +y 扫，右腿朝 -y 扫
                leg_sector_range_extension: 0.8     # 从足端顶点沿楔形边界向外延伸的距离(m)
                leg_sector_near_margin: 0.03         # 允许在足端顶点后方(朝雷达一侧)保留的缓冲距离(m)
                leg_sector_z_margin_up: 0.10         # 相对足端高度向上扩的范围(m)
                leg_sector_z_margin_down: 0.45       # 相对足端高度向下扩的范围(m)，主要影响地面边缘噪声
                # 四个足端扇形顶点在 leg_target_frame(lidar_link) 下的平移微调 offset [x, y, z] (m)
                leg_sector_offset_fl_foot: [ -0.12, -0., 0.0 ]   # 前左足端扇形顶点；x>0 表示往前移
                leg_sector_offset_fr_foot: [ -0.12, 0., 0.0 ]   # 前右足端扇形顶点；x>0 表示往前移
                leg_sector_offset_rl_foot: [ -0.1, -0.05, 0.0 ]   # 后左足端扇形顶点
                leg_sector_offset_rr_foot: [ -0.1, 0.05, 0.0 ]   # 后右足端扇形顶点
                # 四条腿大腿/小腿胶囊直径(m)
                leg_capsule_diameter_fl_thigh: 0.38          #前左大腿
                leg_capsule_diameter_fl_calf: 0.24           #前左小腿
                leg_capsule_diameter_fr_thigh: 0.38          #前右大腿
                leg_capsule_diameter_fr_calf: 0.24           #前右小腿
                leg_capsule_diameter_rl_thigh: 0.18          #后左大腿
                leg_capsule_diameter_rl_calf: 0.18           #后左小腿
                leg_capsule_diameter_rr_thigh: 0.18          #后右大腿
                leg_capsule_diameter_rr_calf: 0.18           #后右小腿
                # 四条腿大腿/小腿在 leg_target_frame 下的平移微调 offset [x, y, z] (m)
                leg_capsule_offset_fl_thigh: [ 0.0, 0.0, 0.0 ]  #左大腿
                leg_capsule_offset_fl_calf:  [ -0.1, 0.0, 0.0 ]  #左小腿
                leg_capsule_offset_fr_thigh: [ 0.0, 0.0, 0.0 ]  #右大腿
                leg_capsule_offset_fr_calf:  [ -0.1, 0.0, 0.0 ]  #右小腿
                leg_capsule_offset_rl_thigh: [ 0.0, 0.0, 0.0 ]  #后左大腿
                leg_capsule_offset_rl_calf:  [ -0.1, 0.0, 0.0 ]  #后左小腿
                leg_capsule_offset_rr_thigh: [ 0.0, 0.0, 0.0 ]  #后右大腿
                leg_capsule_offset_rr_calf:  [ -0.1, 0.0, 0.0 ] #后右小腿

            # 辅路体素(m)：默认不写则与顶层 filter_size_surf 相同；0=关闭下采样
            # filter_size_voxel_lidar_2: 0.2  # 0.1
            # filter_size_voxel_lidar_3: 0.15

            # ---------- 第 2 路（相对主雷达坐标系的外参）----------
            lidar_type: 5
            lid_topic_2: "/rslidar_points"
            Lidar2_to_Lidar_T: [ 0.096, 0., -0.064 ]
            Lidar2_to_Lidar_R: [ 0.25978189, 0.0,   0.96566732,
                                  0.0,        1.0,   0.0,
                                 -0.96566732, 0.0,   0.25978189 ]
            # scan_line: 4
            # timestamp_unit: 3
            # scan_rate: 16

            # ---------- 第 3 路（仅当 lidar_count: 3）----------
            lid_topic_3: "/mid360_3"
            lidar_type_3: 1
            Lidar3_to_Lidar_T: [ 0.0, 0.0, 0.0 ]
            Lidar3_to_Lidar_R: [ 1., 0., 0.,
                                 0., 1., 0.,
                                 0., 0., 1. ]
            # scan_line_3: -1
            # timestamp_unit_3: -1
            # scan_rate_3: -1


        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: false                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false       # true: 保存/发布地图用未降采样点云，精细建图建议 true
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.